upstream xml_processor {
    server xml-processor:8001;
}

upstream odoo_service {
    server odoo-service:8005;
}

upstream siigo_service {
    server siigo-service:8006;
}

upstream integration_config_service {
    server integration-config-service:8007;
}

upstream session_proxy {
    server session-proxy:8004;
}

upstream rag_service {
    server rag-service:8002;
}

upstream llm_service {
    server llm-service:8003;
}

map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $xml_processor_url http://xml-processor:8001;
    set $llm_service_url http://llm-service:8003;

    # Subida de archivos ZIP/XML (hasta 50 MB)
    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ── CORS global ────────────────────────────────────────────────────────────
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Max-Age       86400 always;

    # Preflight OPTIONS — responde directamente sin pasar a los servicios
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── xml-processor ──────────────────────────────────────────────────────────
    location /api/v1/readxml {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/documents {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/receivers {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/issuers {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/catalog {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/batch {
        proxy_pass $xml_processor_url;
    }

    # ── llm-service ────────────────────────────────────────────────────────────
    location /api/v1/query {
        proxy_pass $llm_service_url;
    }

    location /api/v1/ai {
        proxy_pass $llm_service_url;
    }

    location /api/v1/accounting {
        proxy_pass $llm_service_url;
        proxy_read_timeout 120s;
    }

    # ── odoo-service ──────────────────────────────────────────────────────────
    location /api/v1/odoo {
        proxy_pass http://odoo_service;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # ── siigo-service ─────────────────────────────────────────────────────────
    location /api/v1/siigo {
        proxy_pass http://siigo_service;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── integration-config-service ────────────────────────────────────────────
    location /api/v1/integrations {
        proxy_pass http://integration_config_service;
    }

    # ── rag-service (interno, expuesto para debug/admin) ───────────────────────
    location /api/v1/chunks {
        proxy_pass http://rag_service;
    }

    # ── session-proxy ──────────────────────────────────────────────────────────
    location /api/v1/dian {
        proxy_pass http://session_proxy;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/proxy {
        proxy_pass http://session_proxy;
    }

    # ── Documentación centralizada ─────────────────────────────────────────────
    location = /docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
        add_header Cache-Control "no-cache";
    }

    location /openapi/xml-processor.json {
        proxy_pass http://xml_processor/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/llm-service.json {
        proxy_pass http://llm_service/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/rag-service.json {
        proxy_pass http://rag_service/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/session-proxy.json {
        proxy_pass http://session_proxy/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/odoo-service.json {
        proxy_pass http://odoo_service/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/siigo-service.json {
        proxy_pass http://siigo_service/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/integration-config-service.json {
        proxy_pass http://integration_config_service/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Health checks individuales ─────────────────────────────────────────────
    location /health/xml-processor {
        proxy_pass http://xml_processor/health;
    }

    location /health/rag-service {
        proxy_pass http://rag_service/health;
    }

    location /health/llm-service {
        proxy_pass http://llm_service/health;
    }

    location /health/session-proxy {
        proxy_pass http://session_proxy/health;
    }

    location /health/odoo-service {
        proxy_pass http://odoo_service/health;
    }

    location /health/siigo-service {
        proxy_pass http://siigo_service/health;
    }

    location /health/integration-config-service {
        proxy_pass http://integration_config_service/health;
    }

    # ── Health del gateway ─────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }
}
